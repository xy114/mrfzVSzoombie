<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植物大战僵尸 - Arknights</title>
  <link rel="stylesheet" href="game/css/game.css">
  <link rel="stylesheet" href="game/css/ui.css">
</head>
<body>

  <div id="top-bar">
    <div id="top-bar-left">
      <button id="settings-gear-btn" title="设置">
        <canvas id="gear-canvas" width="28" height="28"></canvas>
      </button>
    </div>
    <button id="dev-btn">开发</button>
    <div id="crystal-display">
      <canvas id="crystal-icon-canvas" width="28" height="28"></canvas>
      <span id="crystal-value">0</span>
    </div>
  </div>

  <div id="page-main" class="page active">
    <div id="main-left">
      <div id="standee-frame">
        <span id="standee-emoji">🌻</span>
      </div>
      <div id="standee-name">向日葵</div>
      <button id="edit-standee-btn">编辑展示</button>
    </div>
    <div id="main-right">
      <button class="btn-ark" id="btn-combat">作 战</button>
      <button class="btn-ark" id="btn-handbook">植物图鉴</button>
      <button class="btn-ark" id="btn-enemy-handbook">敌人图鉴</button>
      <button class="btn-ark disabled" id="btn-garden">花 园</button>
    </div>
  </div>

  <div id="page-level-select" class="page">
    <button id="ls-back">← 返回</button>
    <div id="ls-title">作 战</div>
    <div id="ls-content"></div>
  </div>

  <div id="page-combat" class="page">
    <button id="combat-exit-btn" title="退出作战">&lt;</button>
    <div id="combat-header">
      <span class="sun-display">☀️ <span id="combat-sun">150</span></span>
      <span class="wave-display">波次 <span id="combat-wave">1</span></span>
      <span class="crystal-display">💎 <span id="combat-crystal">0</span></span>
    </div>
    <canvas id="game-canvas"></canvas>
    <div id="combat-footer"></div>
    <div id="battle-result">
      <div class="result-title" id="result-title"></div>
      <div class="result-detail" id="result-detail-1"></div>
      <div class="result-detail" id="result-detail-2"></div>
      <div class="result-detail" id="result-detail-3"></div>
      <button class="result-btn" id="result-btn">返回关卡列表</button>
    </div>
  </div>

  <div id="page-handbook" class="page">
    <button id="hb-back">← 返回</button>
    <div id="hb-scroll-area">
      <div id="hb-plant-section" class="hb-section">
        <div class="hb-section-title">植 物 图 鉴</div>
        <div id="hb-plant-scroll" class="hb-scroll-container">
          <div id="hb-plant-grid" class="hb-card-grid"></div>
        </div>
      </div>
    </div>
    <div id="hb-detail-overlay" class="hb-detail-overlay">
      <div class="hb-detail-box">
        <button class="hb-detail-close">&times;</button>
        <div class="hb-detail-title-section">
          <div class="hb-detail-threat" id="hb-detail-threat"></div>
          <div class="hb-detail-name" id="hb-detail-name"></div>
        </div>
        <div class="hb-detail-body">
          <div class="hb-detail-left">
            <canvas id="hb-detail-canvas" width="200" height="260"></canvas>
          </div>
          <div class="hb-detail-right" id="hb-detail-stats"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="page-enemy-handbook" class="page">
    <button id="ehb-back">← 返回</button>
    <div id="ehb-scroll-area">
      <div id="ehb-enemy-section" class="hb-section">
        <div class="hb-section-title">敌 人 图 鉴</div>
        <div id="ehb-enemy-scroll" class="hb-scroll-container">
          <div id="ehb-enemy-grid" class="hb-card-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-garden">
    <div class="modal-box">
      <button class="modal-close">&times;</button>
      <div class="modal-title">花 园</div>
      <p style="color:var(--text-dim);text-align:center;padding:30px 0;">花园系统正在开发中，敬请期待...</p>
    </div>
  </div>

  <div class="modal-overlay" id="modal-plant-select">
    <div class="modal-box">
      <button class="modal-close">&times;</button>
      <div class="modal-title">选择展示植物</div>
      <div class="plant-select-grid" id="ps-grid"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-settings">
    <div class="modal-box settings-box">
      <button class="modal-close">&times;</button>
      <div class="modal-title">设 置</div>
      <div class="settings-section">
        <div class="settings-item">
          <div class="settings-item-info">
            <div class="settings-item-title">纯净模式</div>
            <div class="settings-item-desc">退出开发者模式，恢复进入前的晶核数量与图鉴解锁状态</div>
          </div>
          <button id="pure-mode-btn" class="settings-btn">恢 复</button>
        </div>
        <div class="settings-item">
          <div class="settings-item-info">
            <div class="settings-item-title">重置存档</div>
            <div class="settings-item-desc">清除所有游戏进度，包括晶核、图鉴、关卡记录</div>
          </div>
          <button id="reset-save-btn" class="settings-btn danger">重 置</button>
        </div>
      </div>
      <div class="settings-footer">
        <span style="color:var(--text-dim);font-size:11px;">版本 0.2.0 — Arknights PvZ</span>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-confirm">
    <div class="modal-box" style="text-align:center;">
      <div class="modal-title" id="confirm-title">确 认</div>
      <p id="confirm-msg" style="color:var(--text-secondary);margin:16px 0;line-height:1.6;"></p>
      <div class="btn-row">
        <button id="confirm-cancel">取消</button>
        <button id="confirm-ok" class="primary">确认</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-dev">
    <div class="modal-box">
      <button class="modal-close">&times;</button>
      <div class="modal-title">开发者验证</div>
      <p style="color:var(--text-dim);margin-bottom:14px;">请输入暗号</p>
      <input type="password" id="dev-input" maxlength="20">
      <div class="btn-row" style="justify-content:center;">
        <button id="dev-confirm">确认</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="game/js/main.js"></script>
</body>
</html>
